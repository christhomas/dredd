version: 2.1

commands:
  pip-install-docs:
    steps:
      - run: echo $(python --version) > .python-version
      - restore_cache:
          key: py-deps-{{ checksum ".python-version" }}-{{ checksum "./docs/requirements.txt" }}
      - run: 'if [ ! -d ./venv ]; then python -m venv ./venv; fi'
      - run: echo "source $(pwd)/venv/bin/activate" >> $BASH_ENV
      - run: pip install -r ./docs/requirements.txt
      - save_cache:
          key: py-deps-{{ checksum "./docs/requirements.txt" }}
          paths:
            - ./venv

aliases:
  - &install
    - run: yarn install --frozen-lockfile

  - &node20
    image: cimg/node:20.20

  - &python-docs
    image: cimg/python:3.11-node

  - &test-steps
    steps:
      - checkout
      - <<: *install
      - run: yarn build
      - run: yarn test

jobs:
  test-node20:
    docker: [<<: *node20]
    <<: *test-steps

  test-node18:
    docker: [image: cimg/node:18.20]
    <<: *test-steps

  test-e2e-apib:
    docker: [<<: *node20]
    steps:
      - checkout
      - <<: *install
      - run: yarn build
      - run: npx lerna exec --scope="dredd" yarn e2e:apib

  test-e2e-openapi2:
    docker: [<<: *node20]
    steps:
      - checkout
      - <<: *install
      - run: yarn build
      - run: npx lerna exec --scope="dredd" yarn e2e:openapi2

  quality-checks:
    docker: [<<: *python-docs]
    steps:
      - checkout
      - <<: *install
      - pip-install-docs
      - run: yarn lint
      - run: yarn commit:lint
      - run: yarn docs:lint
      - run: yarn docs:test-extensions

  format-check:
    docker: [<<: *node20]
    steps:
      - checkout
      - <<: *install
      - run: yarn prettify:check

  docs-dry-run:
    # 'dry run', because production build happens directly on the ReadTheDocs
    # infrastructure
    docker: [<<: *python-docs]
    steps:
      - checkout
      - <<: *install
      - pip-install-docs
      - run: yarn docs:build

  smoke-tests:
    docker:
      - <<: *node20
      - image: cimg/mongo:7.0
    steps:
      - checkout
      - <<: *install
      - run: yarn test:smoke

workflows:
  version: 2
  test:
    jobs:
      - format-check
      - quality-checks
      - test-node20
      - test-node18
      - test-e2e-apib
      - test-e2e-openapi2
      - smoke-tests
      - docs-dry-run
