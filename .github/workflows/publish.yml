name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Upgrade npm to support OIDC trusted publishing (requires 11.5.1+)
        run: |
          npm install -g npm@latest --prefix="$HOME/.local"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify npm version
        run: |
          which npm
          npm --version
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Every publishable package, dependencies before the packages that need them, so a
      # consumer never resolves a release whose parts are not on the registry yet.
      #
      # Packed by pnpm and published by npm on purpose: pnpm resolves the workspace protocol
      # to real versions when it packs, which npm would otherwise publish verbatim and leave
      # every consumer with an uninstallable dependency; and npm is what carries provenance.
      - name: Publish
        run: |
          for package in core api-elements apib-parser openapi2-parser openapi3-parser gavel dredd-transactions dredd; do
            cd "$GITHUB_WORKSPACE/packages/$package"
            NAME="$(node -p "require('./package.json').name")"
            VERSION="$(node -p "require('./package.json').version")"
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "$NAME@$VERSION is already published, nothing to do."
              continue
            fi
            echo "Publishing $NAME@$VERSION"
            TARBALL="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n1)"
            npm publish "$TARBALL" --access public --provenance
          done
