name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Upgrade npm to support OIDC trusted publishing (requires 11.5.1+)
        run: |
          npm install -g npm@latest --prefix="$HOME/.local"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify npm version
        run: |
          which npm
          npm --version
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # A release usually moves only one of the two packages, and publishing a version that
      # is already on the registry fails the whole job, so each package is checked first.
      - name: Publish dredd-transactions (dredd depends on it)
        working-directory: packages/dredd-transactions
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, nothing to do."
          else
            npm publish --access public --provenance --loglevel verbose
          fi

      - name: Publish dredd
        working-directory: packages/dredd
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, nothing to do."
          else
            npm publish --access public --provenance
          fi
