name: run-docs-test

on: push

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx commitlint --from HEAD~${{ github.event.pull_request.commits }} --to HEAD

  quality-checks:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r ./docs/requirements.txt
    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm run docs:lint
    - run: pnpm run docs:test-extensions

  docs-dry-run:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r ./docs/requirements.txt
    - run: pnpm install --frozen-lockfile
    - run: pnpm run docs:build
