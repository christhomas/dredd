name: run-test

on: push

# Run every step under bash, on Windows too.
#
# The default shell there is cmd, and when a script exits non-zero cmd asks
# "Terminate batch job (Y/N)?" and waits. Nothing answers it on a runner, so a failing test
# run stopped being a failure and became a job that sat at a prompt until it timed out - the
# suite itself had already finished in three minutes.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}

    # A run takes about two and a half minutes. Without a bound, a test waiting on something
    # that never arrives holds the job for the six hours Actions allows - and GitHub serves no
    # logs for a job still in progress, so the one run that could explain the hang is the one
    # nobody can read. Failing at twenty minutes makes it readable.
    timeout-minutes: 20

    strategy:
      # A failure in one job should not cancel the others. Cancelling made a single failing
      # job report as six, and hid which one had actually failed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 18 is gone: end of life since April 2025, and require(esm) - which lets this
        # CommonJS package use the ESM-only releases of its dependencies - arrived in 20.19.
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm run build
    - run: pnpm run lint
    - run: pnpm test
