name: run-test

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Windows was covered by AppVeyor, which no longer exists. Dredd is installed
        # globally and run from a terminal, and path handling and line endings are where a
        # node CLI breaks there, so the platform is worth a column rather than a promise.
        os: [ubuntu-latest, windows-latest]
        # 18 is gone: end of life since April 2025, and require(esm) - which lets this
        # CommonJS package use the ESM-only releases of its dependencies - arrived in 20.19.
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm run build
    - run: pnpm run lint
    - run: pnpm test
